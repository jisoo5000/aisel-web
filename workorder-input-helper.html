 const config={apiKey:'AIzaSyAJLu3HAH0jxKeLX5vQwEFtkfJHu2DYgmo',authDomain:'aisel-workorder.firebaseapp.com',databaseURL:'https://aisel-workorder-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'aisel-workorder',appId:'1:150328860955:web:98086ff488035fc8be33be'};
 const app=firebase.initializeApp(config,'aiselSalesReadOnly'),auth=app.auth(),db=app.database();
 log('앱의 기존 로그인 연결을 확인하고 있습니다.');

 const refs=await Promise.all((batch.references||[]).map(async r=>{const s=await db.ref('workorders/'+r.code).once('value');const v=s.val();assert(v&&String(v.pumMyeong||'').includes(r.root),'참고 작업지시서를 확인하지 못했습니다.');return {name:v.pumMyeong,parts:(v.sizeSpec||[]).filter(x=>(x.values||[]).some(Boolean)).map(x=>x.part)};}));
 refs.forEach(r=>log('참고 확인: '+r.name+(r.parts.length?' · '+r.parts.join(', '):' · 입력된 치수 없음')));
 const ready=[];let completed=0;

 const backup=ready.map(r=>({code:r.item.code,before:Object.fromEntries(Object.keys(r.patch).map(k=>[k,r.before[k]??null]))}));
