<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- AISEL 제품 진행 현황 v14 (2026-10-04): 경량 공유 목록, 전체 상태 검색, 탭 이동 기록. 원가와 내부 작업지시서 내용은 읽지 않습니다. -->
<title>AISEL 제품 진행 현황</title>
<!-- 2026-08-27 추가: 사진이 오는 서버에 미리 연결해 둡니다.
     안 해두면 첫 사진을 받을 때 그제서야 연결을 맺느라 0.3초쯤 더 걸립니다. -->
<link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin>
<link rel="dns-prefetch" href="https://firebasestorage.googleapis.com">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
:root{--bg:#fff;--sheet:#fff;--ink:#191C23;--muted:#69758A;--hair:#D6DCE6;--navy:#2F3B52;--navy-soft:#EAF0F7;--field:#F3F6FA;--field-line:#CBD3DF}
*{box-sizing:border-box}
html{color-scheme:light;scrollbar-width:thin;scrollbar-color:#AAB4C4 #F3F6FA}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard",-apple-system,"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit}
button{touch-action:manipulation}
button:focus-visible,input:focus-visible,[role=button]:focus-visible{outline:2px solid var(--navy);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:20px 24px 64px}
.page-header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 0 14px;border-bottom:2px solid var(--navy);margin-bottom:10px}
h1{display:flex;align-items:center;gap:16px;margin:0;font-size:20px;font-weight:800;letter-spacing:-.5px;color:var(--navy)}
.brand{font-size:23px;letter-spacing:1.1px;line-height:1}
.page-title{padding-left:16px;border-left:1px solid var(--hair);line-height:1.1}
.page-subtitle{display:none;margin:9px 0 0;color:var(--muted);font-size:12px}
.connection{display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:11px;color:var(--muted)}
.connection::before{content:"";width:6px;height:6px;border-radius:50%;background:#AAB4C4}
.connection.ready::before{background:#67816F}
.connection.error::before{background:#A3264C}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0 0 18px}
.tab{display:flex;justify-content:center;align-items:center;gap:9px;min-width:0;min-height:42px;border:1px solid var(--field-line);background:var(--sheet);color:var(--muted);border-radius:4px;padding:8px 10px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.tab:hover{border-color:var(--navy);color:var(--navy);background:var(--field)}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tab-count{font-size:11px;font-weight:700;line-height:20px;min-width:21px;text-align:center;border-radius:3px;background:var(--field);color:var(--muted);font-variant-numeric:tabular-nums;padding:0 4px}
.tab.on .tab-count{background:rgba(255,255,255,.15);color:#fff}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px}
.section-heading{display:flex;align-items:baseline;gap:8px;margin:0;font-size:14px;color:var(--navy);font-weight:700}
.result-count{font-size:12px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.desc{margin:5px 0 0;font-size:12px;line-height:1.6;color:var(--muted);word-break:keep-all}
.search-wrap{position:relative;display:block;flex:0 0 280px}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#637089;pointer-events:none;width:16px;height:16px}
.search{width:100%;height:40px;min-width:0;border:1px solid var(--field-line);background:var(--field);border-radius:4px;padding:8px 12px 8px 37px;font-size:13px;color:var(--navy)}
.search::placeholder{color:#637089}
.search:focus{border-color:var(--navy);background:#fff}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px 14px}
.card{min-width:0;background:var(--sheet);border:1px solid var(--hair);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.thumb{aspect-ratio:3/4;position:relative;background:var(--field);display:flex;align-items:center;justify-content:center;color:#AAB4C4;font-size:26px;border-bottom:1px solid #E3E7EE;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:contain;display:block}
.thumb.can-open{cursor:zoom-in}
.thumb.can-open:focus-visible{outline-offset:-3px}
.thumb.can-open::after{content:"↗";position:absolute;bottom:8px;right:8px;width:24px;height:24px;display:grid;place-items:center;background:rgba(255,255,255,.9);border:1px solid rgba(47,59,82,.12);border-radius:4px;color:var(--navy);font-size:15px;pointer-events:none}
.body{flex:1;min-width:0;padding:12px;display:flex;flex-direction:column;gap:6px}
.state{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;border-radius:3px;padding:3px 7px;font-size:10.5px;line-height:1.4;font-weight:700;margin-bottom:2px}
.state::before{content:"";width:4px;height:4px;background:currentColor;border-radius:50%}
.name{font-size:13px;font-weight:700;line-height:1.45;color:var(--navy);word-break:keep-all;overflow-wrap:anywhere}
.code{font-size:10.5px;line-height:1.35;color:#637089;font-variant-numeric:tabular-nums;letter-spacing:.15px;overflow-wrap:anywhere}
.factory{font-size:11.5px;line-height:1.5;color:var(--muted);border-top:1px solid #E3E7EE;padding-top:8px;margin-top:3px;overflow-wrap:anywhere}
.price{font-size:12.5px;line-height:1.5;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.meta-label{font-size:11px;line-height:1.5;font-weight:400;color:#637089;margin-right:7px}
.blend{font-size:11px;line-height:1.65;color:#637089;word-break:keep-all;overflow-wrap:anywhere}
.colors{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:1px}
.colors-label{font-size:11px;line-height:1.5;color:#637089;margin-right:2px}
.chip{border-radius:3px;padding:2px 6px;font-size:10.5px;line-height:1.4;font-weight:600;background:#EFEFEF;color:#666;border:1px solid transparent;overflow-wrap:anywhere;max-width:100%}
.chip.light{border-color:rgba(0,0,0,.14)}
.arrive-row{margin-top:auto;padding-top:8px;display:flex;flex-direction:column;gap:6px}
.arrive-btn{width:100%;min-height:36px;border:1px solid transparent;border-radius:4px;padding:8px 4px;font-size:12px;line-height:1.4;font-weight:700;cursor:pointer}
.arrive-btn.go,.arrive-btn.complete{background:var(--navy);color:#fff}
.arrive-btn.go:hover,.arrive-btn.complete:hover{background:#232C3D}
.arrive-btn.undo{background:#fff;color:var(--muted);border-color:var(--field-line);font-size:11px}
.arrive-btn.undo:hover{border-color:var(--navy);color:var(--navy);background:var(--field)}
.arrive-btn:disabled{opacity:.55;cursor:default}
.arrived-at{font-size:10.5px;color:var(--muted);text-align:center}
.empty{background:var(--field);border:1px solid var(--hair);border-radius:6px;padding:56px 20px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8}
.viewer{position:fixed;inset:0;z-index:50;padding:24px;background:rgba(25,32,46,.88);display:none;align-items:center;justify-content:center}
.viewer.on{display:flex}
.viewer img{display:block;width:auto;height:auto;max-width:92vw;max-height:86vh;background:#fff;border-radius:4px}
.viewer .x{position:absolute;top:14px;right:16px;width:42px;height:42px;border-radius:4px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.95);color:var(--navy);font-size:19px;font-weight:700;line-height:1;cursor:pointer}
.viewer .x:focus-visible{outline-color:#fff}
@media(max-width:900px){.search{font-size:16px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.search-wrap{flex-basis:250px}}
@media(max-width:680px){.wrap{padding:16px 16px 48px}.page-header{padding-bottom:12px;margin-bottom:8px}.brand{font-size:21px}h1{gap:12px;font-size:18px}.page-title{padding-left:12px}.page-subtitle{font-size:11px}.connection{font-size:10px}.tabs{margin-bottom:16px;gap:5px}.tab{gap:5px;padding:8px 4px;font-size:11.5px}.tab-count{min-width:17px;font-size:10px;padding:0 3px}.toolbar{display:block;margin-bottom:16px}.search-wrap{margin-top:13px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.body{padding:11px 10px;gap:5px}.desc{font-size:11.5px}.arrive-btn{font-size:11.5px}.name{font-size:12.5px}}
@media(max-width:400px){.wrap{padding:14px 12px 40px}.page-header{gap:6px;align-items:flex-start}.connection{margin-top:5px;font-size:9px;gap:4px}.brand{font-size:19px}h1{font-size:16px;gap:9px}.page-title{padding-left:9px}.tab{gap:5px;min-height:42px;font-size:11px;padding:8px 3px}.grid{gap:10px}.body{padding:10px 9px}.price{font-size:12px}.arrive-btn{font-size:11px}.meta-label{margin-right:5px}}
</style>

</head>
<body>

<main class="wrap">
  <header class="page-header">
    <div>
      <h1><span class="brand">AISEL</span><span class="page-title">제품 진행 현황</span></h1>
      <p class="page-subtitle" id="pageSubtitle" hidden>발주생산부터 상세페이지 등록까지, 한눈에 확인하세요.</p>
    </div>
    <span class="connection" id="connection" role="status">불러오는 중</span>
  </header>

  <nav class="workflow-tabs" aria-label="업무 선택">
    <button type="button" id="workflowProducts" class="workflow-tab on" aria-pressed="true" aria-controls="productsPanel">제작 진행</button>
    <button type="button" id="workflowSamples" class="workflow-tab" aria-pressed="false" aria-controls="samplesPanel">샘플 관리</button>
  </nav>
  <section id="productsPanel" aria-label="제작 진행">
  <nav class="tabs" id="tabs" aria-label="제품 진행 단계"></nav>
  <section class="toolbar" aria-label="제품 목록 검색">
    <div>
      <h2 class="section-heading"><span id="sectionTitle">발주생산</span><span class="result-count" id="resultCount" aria-live="polite"></span></h2>
      <p class="desc" id="desc">제품 정보를 불러오고 있습니다.</p>
    </div>
    <label class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      <input class="search" id="search" type="search" placeholder="품명 또는 품번으로 검색" aria-label="품명 또는 품번으로 검색" autocomplete="off" />
    </label>
  </section>

  <div class="grid" id="grid" aria-busy="true"></div>
  <div class="empty" id="empty" role="status">제품 정보를 불러오고 있습니다.</div>
  </section>
  <section id="samplesPanel" class="samples-panel" aria-labelledby="samplesTitle" hidden>
    <h2 id="samplesTitle" class="sample-visually-hidden">샘플 관리</h2>
    <div class="sample-search-row" role="search" aria-label="샘플 검색">
      <label class="sample-visually-hidden" for="sampleField">검색 항목</label>
      <select id="sampleField" class="sample-search-field"><option value="name">품명</option><option value="color">컬러</option></select>
      <label class="sample-visually-hidden" for="sampleSearch">검색어</label>
      <input id="sampleSearch" class="sample-search-input" type="search" placeholder="품명으로 검색" autocomplete="off" />
    </div>
    <p id="sampleError" class="sample-error" role="alert" hidden></p>
    <div class="sample-list-heading">
      <h3>샘플 기록<span id="sampleResultCount" class="sample-result-count" aria-live="polite"></span><span id="sampleReadOnly" class="sample-read-only" hidden>읽기 전용</span></h3>
      <div class="sample-heading-actions">
        <button type="button" id="sampleReset" class="sample-reset" hidden>검색 초기화</button>
        <span id="sampleAccount" class="sample-account" hidden></span>
        <button type="button" id="sampleDisconnect" class="sample-disconnect" hidden>연결 해제</button>
      </div>
    </div>
    <div id="sampleColumns" class="sample-columns" aria-hidden="true" hidden><span>품명</span><span>컬러 / 사이즈 · 수량</span><span>작업구분</span><span>샘플 위치</span><span>담당자</span><span>입출고일자</span><span>반납 예정일</span></div>
    <div id="sampleList" class="sample-list" aria-busy="true"></div>
    <div id="sampleEmpty" class="sample-empty" role="status">팀원 계정으로 연결하면 샘플 기록을 확인할 수 있습니다.</div>
    <div class="sample-auth-actions"><button type="button" id="sampleConnect" class="sample-connect" hidden>Google 계정으로 연결</button></div>
  </section>
</main>

<!-- 사진 크게 보기. 바깥이나 ✕ 를 누르거나 ESC 로 닫습니다 -->
<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="제품 사진 크게 보기" aria-hidden="true">
  <button type="button" class="x" id="viewerClose" aria-label="닫기">✕</button>
  <img id="viewerImg" alt="" />
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
/* 공유 가능한 짧은 제품 정보만 받습니다. 사진은 화면 가까이 온 카드부터 받습니다. */
firebase.initializeApp({
  apiKey: "AIzaSyAJLu3HAH0jxKeLX5vQwEFtkfJHu2DYgmo",
  authDomain: "aisel-workorder.firebaseapp.com",
  databaseURL: "https://aisel-workorder-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "aisel-workorder",
  storageBucket: "aisel-workorder.firebasestorage.app",
  messagingSenderId: "150328860955",
  appId: "1:150328860955:web:98086ff488035fc8be33be"
});
var STATES = [
  {key:"order",label:"발주생산",bg:"#FFF6E5",fg:"#8A5A18",desc:function(n){return "공장에 발주한 제품 " + n + "개입니다.";},empty:"지금 발주된 제품이 없습니다."},
  {key:"pdp",label:"PDP",bg:"#F3F1EC",fg:"#7A7364",desc:function(n){return "제품 " + n + "개가 상세페이지 등록을 기다리고 있습니다.";},empty:"상세페이지 등록을 기다리는 제품이 없습니다."},
  {key:"planned",label:"예정",bg:"#EEF1F6",fg:"#4B5566"},
  {key:"sale",label:"판매",bg:"#ECF2EC",fg:"#4F6552"}
];
var SHARED = ["planned","order","pdp","sale"];
var ACTIVE = ["order","pdp"];
var TABS = [STATES[0],STATES[1],{key:"all",label:"전체",desc:function(n){return "발주생산과 PDP 제품 " + n + "개입니다.";},empty:"지금 진행 중인 제품이 없습니다."}];
function stateOf(key){return STATES.filter(function(s){return s.key === key;})[0] || null;}
function validFilter(key){return ["order","pdp","all"].indexOf(key) !== -1 ? key : "order";}
function normalizeSearch(value){return String(value || "").toLowerCase().replace(/\s+/g, "");}

var workflowView = "products";
var sampleFilters = {query:"",field:"name"};
var all = {};
var dataReady = false;
var loadFailed = false;
var catalogMissing = false;
var filter = "order";
var query = "";
var tabsEl = document.getElementById("tabs");
var gridEl = document.getElementById("grid");
var emptyEl = document.getElementById("empty");
var searchEl = document.getElementById("search");
var lastSig = null;

/* 상태 이동은 기존 원본/색인/공유 자료와 경량 목록을 한 번에 바꿉니다. */
function todayStr_(){
  var d = new Date();
  var p = function(n){return n < 10 ? "0" + n : "" + n;};
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
function writeStatusPatch_(code, patch, btn, okText){
  patch = Object.assign({},patch);
  if(!patch.updatedAt) patch.updatedAt = Date.now();
  if(btn){btn.disabled = true;btn.textContent = "처리 중...";}
  var updates = {};
  ["workorders","workorderIndex","workorderShare"].forEach(function(path){
    Object.keys(patch).forEach(function(key){updates[path + "/" + code + "/" + key] = patch[key];});
  });
  ["status","arrivedAt"].forEach(function(key){
    if(Object.prototype.hasOwnProperty.call(patch,key)) updates["workorderStatusCatalog/" + code + "/" + key] = patch[key];
  });
  if(patch.updatedAt) updates["workorderStatusCatalog/" + code + "/sourceUpdatedAt"] = patch.updatedAt;
  return firebase.database().ref().update(updates).then(function(){
    if(btn) btn.textContent = okText;
  }).catch(function(err){
    console.error(err);
    if(btn){btn.disabled = false;btn.textContent = "실패 · 다시 시도";}
    alert("저장에 실패했습니다. 인터넷을 확인하고 다시 눌러주세요.");
  });
}
function markArrived_(code,name,btn){
  if(!confirm('"' + (name || code) + '" 오늘 도착 처리할까요?\n\n상세페이지 등록(PDP) 단계로 넘어갑니다.')) return;
  return writeStatusPatch_(code,{status:"pdp",arrivedAt:todayStr_()},btn,"도착 처리됨");
}
function undoArrived_(code,name,btn){
  if(!confirm('"' + (name || code) + '" 도착 처리를 취소하고 발주생산으로 되돌릴까요?')) return;
  return writeStatusPatch_(code,{status:"order",arrivedAt:null},btn,"되돌림");
}
function completePdp_(code,name,btn){
  if(!confirm('"' + (name || code) + '" 상세페이지 등록을 완료했나요?\n\n판매 상태로 이동하며 진행 목록에서는 숨겨집니다. 품명 검색으로 다시 찾을 수 있습니다.')) return;
  return writeStatusPatch_(code,{status:"sale",updatedAt:Date.now()},btn,"등록 완료");
}

/* 탭은 발주생산/PDP만 집계하고, 검색은 모든 공유 상태에서 찾습니다. */
function countOf(key){
  return Object.keys(all).filter(function(code){
    var status = all[code].status;
    return ACTIVE.indexOf(status) !== -1 && (key === "all" || key === status);
  }).length;
}
function renderTabs(){
  tabsEl.innerHTML = "";
  TABS.forEach(function(tab){
    var button = document.createElement("button");
    button.type = "button";
    button.className = "tab" + (filter === tab.key ? " on" : "");
    button.setAttribute("aria-pressed",String(filter === tab.key));
    var label = document.createElement("span");label.textContent = tab.label;
    var count = document.createElement("span");count.className = "tab-count";
    count.textContent = dataReady ? countOf(tab.key) : "–";
    button.appendChild(label);button.appendChild(count);
    button.addEventListener("click",function(){navigate_(tab.key,"");});
    tabsEl.appendChild(button);
  });
  var current = TABS.filter(function(tab){return tab.key === filter;})[0];
  document.getElementById("sectionTitle").textContent = query ? "전체 상태 검색" : current.label;
  document.getElementById("desc").textContent = loadFailed
    ? (dataReady ? "연결이 끊겼습니다. 마지막으로 받은 정보를 표시합니다." : "연결을 확인한 뒤 새로고침해 주세요.")
    : catalogMissing ? "제품 요약 정보가 아직 연결되지 않았습니다. 작업지시서 동기화를 기다리고 있습니다."
    : !dataReady ? "제품 정보를 불러오고 있습니다."
    : query ? "현재 탭과 관계없이 품명·품번으로 검색합니다. 예정과 판매 상태도 포함합니다."
    : countOf(filter) ? current.desc(countOf(filter)) : current.empty;
}
function rowsNow(){
  var needle = normalizeSearch(query);
  return Object.keys(all).map(function(code){return {code:code,e:all[code]};})
    .filter(function(row){
      if(SHARED.indexOf(row.e.status) === -1) return false;
      if(needle) return normalizeSearch(row.code).indexOf(needle) !== -1 || normalizeSearch(row.e.pumMyeong).indexOf(needle) !== -1;
      return ACTIVE.indexOf(row.e.status) !== -1 && (filter === "all" || row.e.status === filter);
    }).sort(function(a,b){
      var aDate = String(a.e.createdAt || ""), bDate = String(b.e.createdAt || "");
      return bDate.localeCompare(aDate) || b.code.localeCompare(a.code);
    });
}
function priceText_(entry){
  if((entry.priceState === "ready" || entry.priceState === "frozen") && Number.isFinite(entry.salePrice) && entry.salePrice > 0){
    return entry.salePrice.toLocaleString("ko-KR") + "원";
  }
  if(entry.priceState === "cost_missing") return "원가 입력 대기";
  if(entry.priceState === "review") return "판매가 확인 필요";
  return "입력 필요";
}
function appendField_(body,className,label,value){
  var row = document.createElement("div");row.className = className;
  var labelEl = document.createElement("span");labelEl.className = "meta-label";labelEl.textContent = label;
  row.appendChild(labelEl);row.appendChild(document.createTextNode(String(value || "").trim() || "입력 필요"));
  body.appendChild(row);
}

/* 사진 자체를 포함한 공유 목록 전체는 받지 않습니다. 받은 사진은 탭을 오가도 재사용합니다. */
var photoCache = Object.create(null);
function photoSource_(value){
  return typeof value === "string" && (/^https:\/\//i.test(value) || /^data:image\/(?:png|jpe?g|gif|webp);base64,/i.test(value)) ? value : "";
}
function readPhotoLeaf_(code,leaf){
  return firebase.database().ref("workorderShare/" + code + "/" + leaf).once("value").then(function(snap){return photoSource_(snap.val());});
}
function photoRecord_(code,version){
  if(photoCache[code] && photoCache[code].version === version) return photoCache[code];
  var record = {version:version,source:null,promise:null,fallback:null,fallbackSource:null};
  photoCache[code] = record;
  record.promise = readPhotoLeaf_(code,"thumbUrl").then(function(src){
    if(src) return src;
    record.fallback = readPhotoLeaf_(code,"thumb").then(function(fallback){record.fallbackSource = fallback;return fallback;});
    return record.fallback;
  }).then(function(src){record.source = src;return src;}).catch(function(err){
    if(photoCache[code] === record) delete photoCache[code];
    throw err;
  });
  return record;
}
function showPhoto_(thumb,code,entry){
  if(thumb._photoRequested) return;
  thumb._photoRequested = true;
  var record = photoRecord_(code,String(entry.sourceUpdatedAt || ""));
  record.promise.then(function(src){
    if(!thumb.isConnected || !src) return;
    var image = document.createElement("img");
    image.setAttribute("loading","lazy");image.setAttribute("decoding","async");
    image.alt = entry.pumMyeong || code;
    thumb.textContent = "";thumb.appendChild(image);
    var currentSource = src;
    var fallbackTried = src === record.fallbackSource;
    function makeOpen_(){
      thumb.className = "thumb can-open";
      thumb.setAttribute("role","button");thumb.setAttribute("tabindex","0");
      thumb.setAttribute("aria-label",(entry.pumMyeong || code) + " 사진 크게 보기");
      thumb.title = "누르면 사진이 크게 보입니다";
    }
    function photoFailed_(){
      thumb.textContent = "▧";thumb.className = "thumb";
      thumb.removeAttribute("role");thumb.removeAttribute("tabindex");
      thumb.removeAttribute("aria-label");thumb.title = "사진을 불러오지 못했습니다";
      currentSource = "";
    }
    image.addEventListener("load",makeOpen_);
    image.addEventListener("error",function(){
      if(fallbackTried){photoFailed_();return;}
      fallbackTried = true;
      if(!record.fallback) record.fallback = readPhotoLeaf_(code,"thumb");
      record.fallback.then(function(fallback){
        if(!fallback || fallback === currentSource){photoFailed_();return;}
        currentSource = fallback;record.source = fallback;record.fallbackSource = fallback;record.promise = Promise.resolve(fallback);image.src = fallback;
      }).catch(photoFailed_);
    });
    thumb.addEventListener("click",function(){if(currentSource) openViewer(currentSource,image.alt);});
    thumb.addEventListener("keydown",function(ev){
      if(currentSource && (ev.key === "Enter" || ev.key === " ")){ev.preventDefault();openViewer(currentSource,image.alt);}
    });
    image.src = src;
  }).catch(function(){thumb.title = "사진을 불러오지 못했습니다";});
}
var photoObserver = typeof IntersectionObserver !== "undefined" ? new IntersectionObserver(function(entries){
  entries.forEach(function(item){
    if(!item.isIntersecting) return;
    photoObserver.unobserve(item.target);
    showPhoto_(item.target,item.target._productCode,item.target._productEntry);
  });
},{rootMargin:"240px 0px"}) : null;
function checkVisiblePhotos_(){
  if(workflowView === "samples" || photoObserver) return;
  Array.prototype.forEach.call(gridEl.querySelectorAll(".thumb"),function(thumb){
    var rect = thumb.getBoundingClientRect();
    if(rect.bottom >= -240 && rect.top <= window.innerHeight + 240) showPhoto_(thumb,thumb._productCode,thumb._productEntry);
  });
}
function render(){
  if(workflowView === "samples"){if(photoObserver) photoObserver.disconnect();return;}
  var rows = rowsNow();
  document.getElementById("resultCount").textContent = dataReady ? (query ? "검색 " : "") + rows.length + "개" : "";
  if(!dataReady){
    if(photoObserver) photoObserver.disconnect();
    gridEl.innerHTML = "";lastSig = null;
    emptyEl.style.display = "block";
    emptyEl.textContent = loadFailed ? "자료를 불러오지 못했습니다. 새로고침해 주세요."
      : catalogMissing ? "제품 요약 정보를 동기화하고 있습니다. 연결되면 이곳에 표시됩니다." : "제품 정보를 불러오고 있습니다.";
    return;
  }
  var sig = JSON.stringify([filter,query,rows]);
  if(sig === lastSig){applyPendingScroll_();return;}
  lastSig = sig;
  if(photoObserver) photoObserver.disconnect();
  gridEl.innerHTML = "";
  emptyEl.style.display = rows.length ? "none" : "block";
  emptyEl.textContent = query ? "검색 결과가 없습니다. 품명이나 품번을 다시 확인해 주세요."
    : TABS.filter(function(tab){return tab.key === filter;})[0].empty;
  rows.forEach(function(row){
    var entry = row.e;
    var card = document.createElement("article");card.className = "card";
    var thumb = document.createElement("div");thumb.className = "thumb";thumb.textContent = "▧";
    thumb._productCode = row.code;thumb._productEntry = entry;
    card.appendChild(thumb);
    var body = document.createElement("div");body.className = "body";
    var state = stateOf(entry.status);
    var badge = document.createElement("span");badge.className = "state";
    badge.style.background = state.bg;badge.style.color = state.fg;badge.textContent = state.label;body.appendChild(badge);
    var name = document.createElement("div");name.className = "name";name.textContent = entry.pumMyeong || "품명 입력 필요";body.appendChild(name);
    var code = document.createElement("div");code.className = "code";code.textContent = row.code;body.appendChild(code);
    appendField_(body,"factory","공장",entry.factory);
    appendField_(body,"price","판매가",priceText_(entry));
    appendField_(body,"blend","혼용률",entry.blend);
    var colors = document.createElement("div");colors.className = "colors";
    var colorLabel = document.createElement("span");colorLabel.className = "colors-label";colorLabel.textContent = "컬러";colors.appendChild(colorLabel);
    var colorList = Array.isArray(entry.colors) ? entry.colors.filter(function(color){return color && String(typeof color === "object" ? color.n || "" : color).trim();}) : [];
    if(!colorList.length){
      var missing = document.createElement("span");missing.className = "blend";missing.textContent = "입력 필요";colors.appendChild(missing);
    }
    colorList.forEach(function(color){
      var chip = document.createElement("span");chip.className = "chip";
      var background = typeof color === "object" ? color.h : "";
      var foreground = typeof color === "object" ? color.t : "";
      if(background){chip.style.background = background;if(foreground) chip.style.color = foreground;if(foreground && foreground.toLowerCase() !== "#ffffff") chip.className += " light";}
      chip.textContent = typeof color === "object" ? color.n : color;colors.appendChild(chip);
    });
    body.appendChild(colors);
    if(ACTIVE.indexOf(entry.status) !== -1){
      var actions = document.createElement("div");actions.className = "arrive-row";
      var button = document.createElement("button");button.type = "button";
      if(entry.status === "order"){
        button.className = "arrive-btn go";button.textContent = "도착 확인";
        button.addEventListener("click",function(){markArrived_(row.code,entry.pumMyeong,button);});
      }else{
        var complete = document.createElement("button");complete.type = "button";complete.className = "arrive-btn complete";complete.textContent = "상세페이지 등록 완료";
        complete.addEventListener("click",function(){completePdp_(row.code,entry.pumMyeong,complete);});actions.appendChild(complete);
        button.className = "arrive-btn undo";button.textContent = "도착 취소";
        button.addEventListener("click",function(){undoArrived_(row.code,entry.pumMyeong,button);});
      }
      actions.appendChild(button);body.appendChild(actions);
      if(entry.status === "pdp" && entry.arrivedAt){var arrived = document.createElement("div");arrived.className = "arrived-at";arrived.textContent = "도착일 " + entry.arrivedAt;body.appendChild(arrived);}
    }
    card.appendChild(body);gridEl.appendChild(card);
    if(photoObserver) photoObserver.observe(thumb);
  });
  applyPendingScroll_();
  checkVisiblePhotos_();
}

/* 사진 확대는 이미 받은 사진을 재사용합니다. */
var viewerEl = document.getElementById("viewer");
var viewerImgEl = document.getElementById("viewerImg");
var viewerCloseEl = document.getElementById("viewerClose");
var viewerLastFocus = null;
function openViewer(src,alt){
  if(!src) return;
  viewerLastFocus = document.activeElement;viewerImgEl.src = src;viewerImgEl.alt = alt || "";
  viewerEl.classList.add("on");viewerEl.setAttribute("aria-hidden","false");document.body.style.overflow = "hidden";viewerCloseEl.focus();
}
function closeViewer(){
  if(!viewerEl.classList.contains("on")) return;
  viewerEl.classList.remove("on");viewerEl.setAttribute("aria-hidden","true");viewerImgEl.removeAttribute("src");document.body.style.overflow = "";
  if(viewerLastFocus && viewerLastFocus.focus) viewerLastFocus.focus();viewerLastFocus = null;
}
viewerEl.addEventListener("click",function(ev){if(ev.target !== viewerImgEl) closeViewer();});
document.addEventListener("keydown",function(ev){
  if(ev.key === "Escape") closeViewer();
  if(ev.key === "Tab" && viewerEl.classList.contains("on")){ev.preventDefault();viewerCloseEl.focus();}
});

/* 탭마다 이동 기록을 남기고 검색 한 번을 기록 하나로 묶습니다. */
var pendingScroll = null;
var restoringScroll = false;
var scrollFrame = null;
function validSampleFilters_(value){
  value = value || {};
  return {query:String(value.query || "").trim(),field:["name","color"].indexOf(value.field) !== -1 ? value.field : "name"};
}
function viewState_(scroll){return {aiselStatus:true,filter:filter,query:query,view:workflowView,sampleFilters:Object.assign({},sampleFilters),scrollY:Math.max(0,Number(scroll) || 0)};}
function viewUrl_(){
  var url = new URL(window.location.href);url.searchParams.set("tab",filter);
  if(query) url.searchParams.set("q",query);else url.searchParams.delete("q");
  if(workflowView === "samples") url.searchParams.set("view","samples");else url.searchParams.delete("view");
  if(sampleFilters.query) url.searchParams.set("sq",sampleFilters.query);else url.searchParams.delete("sq");
  if(sampleFilters.field !== "name") url.searchParams.set("sfield",sampleFilters.field);else url.searchParams.delete("sfield");
  ["sloc","sop","sowner"].forEach(function(key){url.searchParams.delete(key);});
  return url.pathname + url.search + url.hash;
}
function saveCurrentView_(){window.history.replaceState(viewState_(window.scrollY),"",viewUrl_());}
function applyPendingScroll_(){
  if(pendingScroll === null || (workflowView === "samples" ? !window.AiselSamples || !window.AiselSamples.isReady() : !dataReady)) return;
  var target = pendingScroll;pendingScroll = null;restoringScroll = true;
  window.requestAnimationFrame(function(){
    window.scrollTo(0,target);checkVisiblePhotos_();
    window.requestAnimationFrame(function(){restoringScroll = false;});
  });
}
function updateWorkflow_(){
  var isSamples = workflowView === "samples";
  if(!isSamples && document.getElementById("productsPanel").hidden) lastSig = null;
  document.getElementById("productsPanel").hidden = isSamples;
  document.getElementById("samplesPanel").hidden = !isSamples;
  document.getElementById("connection").hidden = isSamples;
  document.getElementById("pageSubtitle").hidden = isSamples;
  [["workflowProducts",!isSamples],["workflowSamples",isSamples]].forEach(function(pair){
    var button = document.getElementById(pair[0]);button.classList.toggle("on",pair[1]);button.setAttribute("aria-pressed",String(pair[1]));
  });
  if(isSamples && window.AiselSamples) window.AiselSamples.onShow();
}
function navigateWorkflow_(nextView){
  nextView = nextView === "samples" ? "samples" : "products";
  if(nextView === workflowView) return;
  saveCurrentView_();workflowView = nextView;closeViewer();pendingScroll = 0;
  window.history.pushState(viewState_(0),"",viewUrl_());updateWorkflow_();renderTabs();render();applyPendingScroll_();
}
function navigateSamples_(nextFilters,replace){
  nextFilters = validSampleFilters_(nextFilters);
  if(JSON.stringify(nextFilters) === JSON.stringify(sampleFilters)) return;
  if(!replace) saveCurrentView_();
  sampleFilters = nextFilters;pendingScroll = 0;
  window.history[replace ? "replaceState" : "pushState"](viewState_(0),"",viewUrl_());
  if(window.AiselSamples) window.AiselSamples.render();
}
function navigate_(nextFilter,nextQuery,preserveInput){
  nextFilter = validFilter(nextFilter);nextQuery = String(nextQuery || "").trim();
  if(filter === nextFilter && query === nextQuery) return;
  saveCurrentView_();filter = nextFilter;query = nextQuery;
  if(!preserveInput) searchEl.value = query;
  window.history.pushState(viewState_(0),"",viewUrl_());pendingScroll = 0;
  renderTabs();render();
}
function restoreView_(state){
  var url = new URL(window.location.href);
  var saved = state && state.aiselStatus;
  filter = validFilter(saved ? state.filter : url.searchParams.get("tab"));
  query = String(saved ? state.query || "" : url.searchParams.get("q") || "").trim();
  workflowView = (saved ? state.view : url.searchParams.get("view")) === "samples" ? "samples" : "products";
  sampleFilters = validSampleFilters_(saved && state.sampleFilters ? state.sampleFilters : {query:url.searchParams.get("sq"),field:url.searchParams.get("sfield")});
  document.getElementById("sampleSearch").value = sampleFilters.query;
  searchEl.value = query;pendingScroll = saved ? Math.max(0,Number(state.scrollY) || 0) : 0;
  closeViewer();updateWorkflow_();renderTabs();render();
  if(workflowView === "samples" && window.AiselSamples) window.AiselSamples.render();
}
document.getElementById("workflowProducts").addEventListener("click",function(){navigateWorkflow_("products");});
document.getElementById("workflowSamples").addEventListener("click",function(){navigateWorkflow_("samples");});
if("scrollRestoration" in window.history) window.history.scrollRestoration = "manual";
restoreView_(window.history.state);
window.history.replaceState(viewState_(pendingScroll),"",viewUrl_());
window.addEventListener("popstate",function(ev){restoreView_(ev.state);});
window.addEventListener("scroll",function(){
  if(scrollFrame !== null) return;
  scrollFrame = window.requestAnimationFrame(function(){
    scrollFrame = null;if(!restoringScroll && pendingScroll === null) saveCurrentView_();checkVisiblePhotos_();
  });
},{passive:true});
window.addEventListener("resize",checkVisiblePhotos_);
window.addEventListener("pagehide",function(){if(!restoringScroll && pendingScroll === null) saveCurrentView_();});
searchEl.addEventListener("input",function(ev){
  var next = String(ev.target.value || "").trim();
  if(next === query) return;
  // 한글 조합 중에는 입력칸 값을 다시 쓰지 않습니다.
  if(!query || !next){navigate_(filter,next,true);return;}
  query = next;window.history.replaceState(viewState_(0),"",viewUrl_());pendingScroll = 0;renderTabs();render();
});

/* 경량 목록 한 번의 초기 수신 이후 변경분을 계속 반영합니다. */
firebase.database().ref("workorderStatusCatalog").on("value",function(snap){
  var catalog = snap.val();all = {};
  if(catalog && typeof catalog === "object") Object.keys(catalog).forEach(function(code){
    var entry = catalog[code];
    if(entry && entry.schemaVersion === 1 && SHARED.indexOf(entry.status) !== -1) all[code] = entry;
  });
  catalogMissing = !catalog;dataReady = !catalogMissing;loadFailed = false;
  gridEl.setAttribute("aria-busy",String(!dataReady));emptyEl.setAttribute("role","status");
  var connection = document.getElementById("connection");connection.className = "connection" + (dataReady ? " ready" : "");
  connection.textContent = dataReady ? "불러오기 완료" : "동기화 대기";
  renderTabs();render();
},function(err){
  loadFailed = true;gridEl.setAttribute("aria-busy","false");
  var connection = document.getElementById("connection");connection.className = "connection error";connection.textContent = "연결 확인";
  emptyEl.setAttribute("role","alert");renderTabs();render();console.error(err);
});
</script>
