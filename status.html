<!-- AISEL 제품 진행 현황 (공유용) v9 (2026-10-03)
     v9: 작업지시서 v94의 네이비·화이트 UI, 반응형 카드, 단계별 개수와 검색 결과 안내.
     ─ v7 (2026-09-28)
     v7 에서 바뀐 것 - PDP 카드에 MD용 「상세페이지 등록 완료」 버튼을 추가했습니다.
                     누르면 작업지시서·색인·공유 화면이 한 번에 판매 상태로 바뀌고
                     「최근 완료」 탭에 30일 동안 남습니다. 도착 취소는 오조작 복구용으로 유지합니다.
     ─ v6 (2026-09-23)
     v6 에서 바뀐 것 - 작업지시서의 혼용률과 컬러를 카드에 함께 표시합니다.
     ─ v5 (2026-09-20)
     v5 에서 바뀐 것 - 카드에 「💵 판매가」 한 줄. 연경님(MD)이 판매가를 보러 작업지시서에 들어오지 않게 하려고
                     작업지시서 주소를 바꾸면서 판매가를 여기로 옮겼습니다. 값은 작지의 「타겟 판매가」 칸(targetThreshold)
                     그대로이고, 원가는 여전히 안 넘어옵니다.
     ─ v4 (2026-09-15)
     v4 에서 바뀐 것 - 발주생산 카드에 「🚚 도착 확인」 버튼이 생겼습니다.
                    물류가 실제 도착을 보고 직접 눌러 PDP로 넘깁니다(오조작 대비 되돌리기 있음).
                    2026-09-15 지수 지시 — 지금까지는 지수/디자이너가 감으로 눌렀는데,
                    정확한 도착일을 아는 사람은 물류뿐이라 그쪽에서 직접 찍게 합니다.
                    ★이 화면의 "편집 기능이 없습니다" 원칙 중 이 버튼 하나만 예외입니다.
                    자세한 내용은 아래 LOGISTICS 섹션 주석 참고.
     v3 에서 바뀐 것 - 카드에 있던 날짜(작지 생성일)를 뺐습니다.
                    발주일·납기처럼 보여서 헷갈린다는 지적으로 제거.
     v2 에서 바뀐 것 - 사진을 자르지 않고 전체를 보여줍니다 / 사진을 누르면 크게 뜹니다
                    / 「🛍️ 최근 완료」 단계 추가 (판매로 넘어간 지 30일 이내)
     물류·MD 공유 전용 화면입니다. 작업지시서(work-order.html)와는 다른 파일입니다.

     ★ 이 화면은 파이어베이스의 workorderShare 칸만 읽습니다.
       원가·공임·원단처·원단명·판매수량·디자이너·사이즈·상세설명은
       화면에서 숨기는 게 아니라 애초에 내려오지도 않습니다.
       넘길 값을 늘리거나 줄이려면 work-order.html 의 WO_SHARE_KEYS 를 고칩니다.

     ★ 편집 기능은 상태 이동 버튼뿐입니다: 물류의 「도착 확인」과 MD의
       「상세페이지 등록 완료」. 사진을 누르면 그 사진이 크게만 뜹니다.
     ★ 판매현황·무드보드·발주서 화면은 이 파일에 존재하지 않습니다.
-->

<style>
:root{--bg:#fff;--sheet:#fff;--ink:#191C23;--muted:#69758A;--hair:#D6DCE6;--navy:#2F3B52;--navy-soft:#EAF0F7;--field:#F3F6FA;--field-line:#CBD3DF}
*{box-sizing:border-box}
html{color-scheme:light;scrollbar-width:thin;scrollbar-color:#AAB4C4 #F3F6FA}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard",-apple-system,"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit}
button{touch-action:manipulation}
button:focus-visible,input:focus-visible,[role=button]:focus-visible{outline:2px solid var(--navy);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:32px 24px 64px}
.page-header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 0 22px;border-bottom:2px solid var(--navy);margin-bottom:18px}
h1{display:flex;align-items:center;gap:16px;margin:0;font-size:20px;font-weight:800;letter-spacing:-.5px;color:var(--navy)}
.brand{font-size:23px;letter-spacing:1.1px;line-height:1}
.page-title{padding-left:16px;border-left:1px solid var(--hair);line-height:1.1}
.page-subtitle{margin:9px 0 0;color:var(--muted);font-size:12px}
.connection{display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:11px;color:var(--muted)}
.connection::before{content:"";width:6px;height:6px;border-radius:50%;background:#AAB4C4}
.connection.ready::before{background:#67816F}
.connection.error::before{background:#A3264C}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:0 0 18px}
.tab{display:flex;justify-content:center;align-items:center;gap:9px;min-width:0;min-height:42px;border:1px solid var(--field-line);background:var(--sheet);color:var(--muted);border-radius:4px;padding:8px 10px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.tab:hover{border-color:var(--navy);color:var(--navy);background:var(--field)}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tab-count{font-size:11px;font-weight:700;line-height:20px;min-width:21px;text-align:center;border-radius:3px;background:var(--field);color:var(--muted);font-variant-numeric:tabular-nums;padding:0 4px}
.tab.on .tab-count{background:rgba(255,255,255,.15);color:#fff}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px}
.section-heading{display:flex;align-items:baseline;gap:8px;margin:0;font-size:14px;color:var(--navy);font-weight:700}
.result-count{font-size:12px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.desc{margin:5px 0 0;font-size:12px;line-height:1.6;color:var(--muted);word-break:keep-all}
.search-wrap{position:relative;display:block;flex:0 0 280px}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#637089;pointer-events:none;width:16px;height:16px}
.search{width:100%;height:40px;min-width:0;border:1px solid var(--field-line);background:var(--field);border-radius:4px;padding:8px 12px 8px 37px;font-size:13px;color:var(--navy)}
.search::placeholder{color:#637089}
.search:focus{border-color:var(--navy);background:#fff}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px 14px}
.card{min-width:0;background:var(--sheet);border:1px solid var(--hair);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.thumb{aspect-ratio:3/4;position:relative;background:var(--field);display:flex;align-items:center;justify-content:center;color:#AAB4C4;font-size:26px;border-bottom:1px solid #E3E7EE;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:contain;display:block}
.thumb.can-open{cursor:zoom-in}
.thumb.can-open:focus-visible{outline-offset:-3px}
.thumb.can-open::after{content:"↗";position:absolute;bottom:8px;right:8px;width:24px;height:24px;display:grid;place-items:center;background:rgba(255,255,255,.9);border:1px solid rgba(47,59,82,.12);border-radius:4px;color:var(--navy);font-size:15px;pointer-events:none}
.body{flex:1;min-width:0;padding:12px;display:flex;flex-direction:column;gap:6px}
.state{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;border-radius:3px;padding:3px 7px;font-size:10.5px;line-height:1.4;font-weight:700;margin-bottom:2px}
.state::before{content:"";width:4px;height:4px;background:currentColor;border-radius:50%}
.name{font-size:13px;font-weight:700;line-height:1.45;color:var(--navy);word-break:keep-all;overflow-wrap:anywhere}
.code{font-size:10.5px;line-height:1.35;color:#637089;font-variant-numeric:tabular-nums;letter-spacing:.15px;overflow-wrap:anywhere}
.factory{font-size:11.5px;line-height:1.5;color:var(--muted);border-top:1px solid #E3E7EE;padding-top:8px;margin-top:3px;overflow-wrap:anywhere}
.price{font-size:12.5px;line-height:1.5;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.meta-label{font-size:11px;line-height:1.5;font-weight:400;color:#637089;margin-right:7px}
.blend{font-size:11px;line-height:1.65;color:#637089;word-break:keep-all;overflow-wrap:anywhere}
.colors{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:1px}
.colors-label{font-size:11px;line-height:1.5;color:#637089;margin-right:2px}
.chip{border-radius:3px;padding:2px 6px;font-size:10.5px;line-height:1.4;font-weight:600;background:#EFEFEF;color:#666;border:1px solid transparent;overflow-wrap:anywhere;max-width:100%}
.chip.light{border-color:rgba(0,0,0,.14)}
.coordi{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.coordi img,.coordi .ph{width:23px;height:23px;border-radius:50%;flex:0 0 auto;border:1px solid var(--hair);background:var(--field);object-fit:cover;display:block}
.coordi .ph{display:flex;align-items:center;justify-content:center;font-size:10px;color:#B9BFCB}
.coordi .more{font-size:11px;font-weight:700;color:var(--muted);margin-left:2px}
.arrive-row{margin-top:auto;padding-top:8px;display:flex;flex-direction:column;gap:6px}
.arrive-btn{width:100%;min-height:36px;border:1px solid transparent;border-radius:4px;padding:8px 4px;font-size:12px;line-height:1.4;font-weight:700;cursor:pointer}
.arrive-btn.go,.arrive-btn.complete{background:var(--navy);color:#fff}
.arrive-btn.go:hover,.arrive-btn.complete:hover{background:#232C3D}
.arrive-btn.undo{background:#fff;color:var(--muted);border-color:var(--field-line);font-size:11px}
.arrive-btn.undo:hover{border-color:var(--navy);color:var(--navy);background:var(--field)}
.arrive-btn:disabled{opacity:.55;cursor:default}
.arrived-at{font-size:10.5px;color:var(--muted);text-align:center}
.empty{background:var(--field);border:1px solid var(--hair);border-radius:6px;padding:56px 20px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8}
.viewer{position:fixed;inset:0;z-index:50;padding:24px;background:rgba(25,32,46,.88);display:none;align-items:center;justify-content:center}
.viewer.on{display:flex}
.viewer img{display:block;width:auto;height:auto;max-width:92vw;max-height:86vh;background:#fff;border-radius:4px}
.viewer .x{position:absolute;top:14px;right:16px;width:42px;height:42px;border-radius:4px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.95);color:var(--navy);font-size:19px;font-weight:700;line-height:1;cursor:pointer}
.viewer .x:focus-visible{outline-color:#fff}
@media(max-width:900px){.search{font-size:16px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.search-wrap{flex-basis:250px}}
@media(max-width:680px){.wrap{padding:22px 16px 48px}.page-header{padding-bottom:18px;margin-bottom:14px}.brand{font-size:21px}h1{gap:12px;font-size:18px}.page-title{padding-left:12px}.page-subtitle{font-size:11px}.connection{font-size:10px}.tabs{margin-bottom:16px;gap:5px}.tab{gap:5px;padding:8px 4px;font-size:11.5px}.tab-count{min-width:17px;font-size:10px;padding:0 3px}.toolbar{display:block;margin-bottom:16px}.search-wrap{margin-top:13px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.body{padding:11px 10px;gap:5px}.desc{font-size:11.5px}.arrive-btn{font-size:11.5px}.name{font-size:12.5px}}
@media(max-width:480px){.tab{flex-direction:column;gap:3px;min-height:58px;font-size:11px;padding:6px 2px}.tab-count{line-height:17px}}
@media(max-width:400px){.wrap{padding:20px 12px 40px}.page-header{gap:6px;align-items:flex-start}.connection{margin-top:5px;font-size:9px;gap:4px}.brand{font-size:19px}h1{font-size:16px;gap:9px}.page-title{padding-left:9px}.tab{flex-direction:column;gap:3px;min-height:58px;font-size:11px;padding:6px 2px}.tab-count{line-height:17px}.grid{gap:10px}.body{padding:10px 9px}.price{font-size:12px}.arrive-btn{font-size:11px}.meta-label{margin-right:5px}}
</style>
</head>
<body>

<main class="wrap">

    <div>
      <h1><span class="brand">AISEL</span><span class="page-title">제품 진행 현황</span></h1>

/* 보여줄 상태와 순서. 샘플관리는 내부 단계라 공유하지 않습니다. */

/* ---------- 상태 이동: 물류 도착 확인 + MD 상세페이지 등록 완료 ----------
   물류는 발주생산→PDP, MD는 PDP→최근 완료(판매)를 직접 처리합니다.

   work-order.html 이 저장할 때와 똑같이 workorders · workorderIndex · workorderShare
   세 칸을 같이 고칩니다. 한 곳만 고치면 이 화면과 work-order.html 이 서로 다른 상태를
   보여주게 됩니다 (세 칸이 왜 따로 있는지는 work-order.html:2634-2661,4200-4221 참고).

   ★비밀번호는 없습니다(2026-09-15 지수 지시로 뺐습니다). 눌렀을 때 확인 팝업 한 번
   (confirm)만 거칩니다. 이 주소를 아는 사람은 누구나 누를 수 있다는 뜻입니다 — 진짜
   막아야 한다면 파이어베이스 콘솔에서 이 경로 쓰기 규칙을 따로 잠가야 합니다
   (이건 이 파일만 고쳐서는 안 되는 일입니다). */
function todayStr_(){
  var d = new Date();
  var p = function(n){ return n < 10 ? "0" + n : "" + n; };
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
function writeStatusPatch_(code, patch, btn, okText){
  if(btn){ btn.disabled = true; btn.textContent = "처리 중..."; }
  var paths = ["workorders", "workorderIndex", "workorderShare"];
  var updates = {};
  paths.forEach(function(p){
    Object.keys(patch).forEach(function(k){ updates[p + "/" + code + "/" + k] = patch[k]; });
  });
  /* 세 저장소를 원자적으로 바꿉니다. 일부만 바뀌어 화면과 작지 상태가 갈리는 일을 막습니다. */
  firebase.database().ref().update(updates).then(function(){
    if(btn) btn.textContent = okText;
  }).catch(function(err){
    console.error(err);
    if(btn){ btn.disabled = false; btn.textContent = "⚠ 실패 (다시 시도)"; }
    alert("저장에 실패했습니다. 인터넷을 확인하고 다시 눌러주세요.");
  });
}
function markArrived_(code, name, btn){
  if(!confirm("\"" + (name || code) + "\" 오늘 도착 처리할까요?\n\n상세페이지 등록(PDP) 단계로 넘어갑니다.")) return;
  writeStatusPatch_(code, { status:"pdp", arrivedAt: todayStr_() }, btn, "✓ 도착 처리됨");
}
function undoArrived_(code, name, btn){
  if(!confirm("\"" + (name || code) + "\" 도착 처리를 취소하고 발주생산으로 되돌릴까요?")) return;
  writeStatusPatch_(code, { status:"order", arrivedAt:null }, btn, "↩ 되돌림");
}
function completePdp_(code, name, btn){
  if(!confirm("\"" + (name || code) + "\" 상세페이지 등록을 완료했나요?\n\n최근 완료로 이동합니다.")) return;
  writeStatusPatch_(code, { status:"sale", updatedAt:Date.now() }, btn, "✓ 최근 완료로 이동됨");
}

var all = {};
var dataReady = false;
var loadFailed = false;
/* 2026-08-27: 화면을 열면 「발주생산」이 이미 눌려 있습니다.
   물류가 전체를 보고 자기 일을 골라내는 수고를 없애려는 것입니다.
   발주된 게 없으면 빈 화면이 되지만, 아래 설명 문장이 그 사실을 그대로 알려줍니다. */
var filter = "order";
var query = "";

/* ---------- 탭 ---------- */
var tabsEl = document.getElementById("tabs");
/* 코디 짝 표. A 작지가 B를 걸었으면 B 카드에서도 A가 보여야 합니다.
   그래서 적혀 있는 것(한 방향)을 양쪽으로 펴서 씁니다. */
var pairs = {};
function buildPairs(){
  pairs = {};
  var add = function(a, b){
    if(!a || !b || a === b) return;
    if(!pairs[a]) pairs[a] = [];
    if(pairs[a].indexOf(b) === -1) pairs[a].push(b);
  };
  for(var c in all){
    if(!Object.prototype.hasOwnProperty.call(all, c)) continue;
    var list = (all[c] || {}).coordi;
    if(!Array.isArray(list)) continue;
    for(var i=0;i<list.length;i++){ add(c, list[i]); add(list[i], c); }
  }
}
function coordiRow(code){
  var mates = (pairs[code] || []).filter(function(m){
    var e = all[m];
    return e && SHOWN.indexOf(e.status) !== -1;   // 공유 안 하는 단계는 빼고
  });
  if(!mates.length) return null;
  var row = document.createElement("div");
  row.className = "coordi";
  mates.slice(0, 3).forEach(function(m){
    var e = all[m] || {};
    var src = e.thumb || e.thumbUrl || "";
    var nm = (e.pumMyeong || m) + " · " + m;
    if(src){
      var im = document.createElement("img");
      im.setAttribute("loading", "lazy");
      im.setAttribute("decoding", "async");
      im.src = src; im.alt = nm; im.title = nm;
      row.appendChild(im);
    }else{
      var ph = document.createElement("span");
      ph.className = "ph"; ph.textContent = "▧"; ph.title = nm;
      row.appendChild(ph);
    }
  });
  if(mates.length > 3){
    var more = document.createElement("span");
    more.className = "more";
    more.textContent = "+" + (mates.length - 3);
    row.appendChild(more);
  }
  return row;
}

function countOf(key){
  var n = 0;
  for(var c in all){
    if(!Object.prototype.hasOwnProperty.call(all, c)) continue;
    var st = (all[c] || {}).status;
    if(SHOWN.indexOf(st) === -1) continue;
    if(key === "all" || st === key) n++;
  }
  return n;
}
function renderTabs(){
  tabsEl.innerHTML = "";
  var list = [{
    key:"all", label:"전체",
    desc:  function(n){ return "지금 진행 중인 제품 " + n + "개입니다. 상태를 눌러 단계별로 보실 수 있습니다."; },
    empty: "지금 진행 중인 제품이 없습니다."
  }].concat(STATES);
  list.forEach(function(s){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "tab" + (filter === s.key ? " on" : "");
    // 작업지시서와 동일한 네이비 탭. 개수는 별도 배지로 구분합니다.
    var cnt = countOf(s.key);
    b.setAttribute("aria-pressed", String(filter === s.key));
    var label = document.createElement("span");
    label.textContent = s.label;
    var count = document.createElement("span");
    count.className = "tab-count";
    count.textContent = dataReady ? cnt : "–";
    b.appendChild(label);
    b.appendChild(count);
    b.addEventListener("click", function(){ filter = s.key; renderTabs(); render(); });
    tabsEl.appendChild(b);
  });
  // 고른 탭의 설명. 개수는 문장 안에 들어갑니다
  var cur = null;
  for(var i=0;i<list.length;i++){ if(list[i].key === filter) cur = list[i]; }
  var d = document.getElementById("desc");
  if(cur){
    var cnt = countOf(filter);
    d.style.display = "block";
    d.textContent = loadFailed ? "연결을 확인한 뒤 새로고침해 주세요."
      : !dataReady ? "제품 정보를 불러오고 있습니다."
      : cnt ? cur.desc(cnt) : cur.empty;
    document.getElementById("sectionTitle").textContent = cur.label === "전체" ? "전체 제품" : cur.label;
  }else{
    d.style.display = "none";
  }
}

/* ---------- 목록 ---------- */
var gridEl  = document.getElementById("grid");
var emptyEl = document.getElementById("empty");
var lastSig = null;

function rowsNow(){
  return Object.keys(all)
    .map(function(code){ return { code: code, e: all[code] || {} }; })
    // 공유하지 않는 단계(샘플관리 등)는 목록에서 아예 제외합니다
    .filter(function(x){ return SHOWN.indexOf(x.e.status) !== -1; })
    .filter(function(x){ return filter === "all" || x.e.status === filter; })
    .filter(function(x){
      if(!query) return true;
      return (x.code + " " + (x.e.pumMyeong || "")).toLowerCase().indexOf(query) !== -1;
    })
    .sort(function(a, b){
      var da = String(a.e.createdAt || ""), db = String(b.e.createdAt || "");
      if(da !== db) return db.localeCompare(da);
      return b.code.localeCompare(a.code);
    });
}

function render(){
  buildPairs();
  var rows = rowsNow();
  document.getElementById("resultCount").textContent = dataReady
    ? (query ? "검색 " + rows.length + " / " + countOf(filter) + "개" : rows.length + "개") : "";
  if(!dataReady){
    emptyEl.style.display = "block";
    emptyEl.textContent = loadFailed ? "자료를 불러오지 못했습니다. 새로고침해 주세요." : "제품 정보를 불러오고 있습니다.";
    return;
  }
  /* 내용이 그대로면 다시 그리지 않습니다.
     여러 명이 같이 볼 때 화면이 번쩍이는 것을 막는 장치입니다. */
  var sig = JSON.stringify([filter, query, rows.map(function(x){
    return [x.code, x.e.status, x.e.pumMyeong, x.e.factory,
            x.e.yy, x.e.mm, x.e.dd, JSON.stringify(x.e.colors || []),
            (pairs[x.code] || []).join(","),
            x.e.thumbUrl || "", (x.e.thumb || "").length, x.e.arrivedAt || "",
            x.e.targetThreshold || "", x.e.priceSource || "", x.e.blend || ""];   /* 판매가·확정 여부·혼용률이 바뀌면 다시 그립니다 */
  })]);
  if(sig === lastSig) return;
  lastSig = sig;

  gridEl.innerHTML = "";
  emptyEl.style.display = rows.length ? "none" : "block";
  emptyEl.textContent = query ? "검색 결과가 없습니다. 품명이나 품번을 다시 확인해 주세요."
    : filter === "all" ? "지금 진행 중인 제품이 없습니다." : stateOf(filter).empty;

  rows.forEach(function(x, idx){
    var e = x.e;
    var card = document.createElement("article");
    card.className = "card";

    var th = document.createElement("div");
    th.className = "thumb";
    // 공유 데이터의 압축 사진을 우선 씁니다. 별도 파일 저장소가 막혀도 사진이 보입니다.
    var src = e.thumb || e.thumbUrl || "";
    if(src){
      var im = document.createElement("img");
      /* 2026-08-27 수정: 앞의 6장은 열자마자 화면에 보이는 것이라 미루지 않고 바로 받습니다.
         전부 "보일 때 받기"로 두면 브라우저가 한 박자 늦게 시작해서 늦게 뜨는 느낌이 납니다.
         나머지는 스크롤할 때 받습니다. */
      if(idx < 6){
        im.setAttribute("fetchpriority", "high");
      }else{
        im.setAttribute("loading", "lazy");
      }
      im.setAttribute("decoding", "async");
      im.src = src;
      im.alt = e.pumMyeong || x.code;
      th.appendChild(im);
      /* 2026-08-27 추가: 누르면 이 사진이 크게 뜹니다.
         새로 받는 파일이 없습니다 — 방금 받은 이 파일을 그대로 키웁니다. */
      th.className = "thumb can-open";
      th.setAttribute("role", "button");
      th.setAttribute("tabindex", "0");
      th.title = "누르면 사진이 크게 보입니다";
      th.addEventListener("click", function(){ openViewer(src, im.alt); });
      th.addEventListener("keydown", function(ev){
        if(ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); openViewer(src, im.alt); }
      });
    }else{
      th.textContent = "▧";
    }
    card.appendChild(th);

    var body = document.createElement("div");
    body.className = "body";

    var st = stateOf(e.status);
    if(st){
      var sp = document.createElement("span");
      sp.className = "state";
      sp.style.background = st.bg;
      sp.style.color = st.fg;
      sp.textContent = st.label;
      body.appendChild(sp);
    }

    var nm = document.createElement("div");
    nm.className = "name";
    nm.textContent = e.pumMyeong || "(품명 미정)";
    body.appendChild(nm);

    var cd = document.createElement("div");
    cd.className = "code";
    cd.textContent = x.code;
    body.appendChild(cd);

    var fac = document.createElement("div");
    fac.className = "factory";
    var facLabel = document.createElement("span");
    facLabel.className = "meta-label";
    facLabel.textContent = "공장";
    fac.appendChild(facLabel);
    fac.appendChild(document.createTextNode(e.factory || "미정"));
    body.appendChild(fac);

    /* 2026-09-20 추가: 판매가. 작지의 타겟 판매가 칸 값 그대로입니다. 비어 있으면 「판매가 미정」 */
    var pr = document.createElement("div");
    pr.className = "price";
    var pv = String(e.targetThreshold || "").replace(/[^0-9]/g, "");
    var prLabel = document.createElement("span");
    prLabel.className = "meta-label";
    prLabel.textContent = "판매가";
    pr.appendChild(prLabel);
    pr.appendChild(document.createTextNode(!pv ? "미정"
      : e.priceSource !== "manual" ? "재확인 필요"
      : (Number(pv).toLocaleString("ko-KR") + "원")));
    body.appendChild(pr);

    /* 2026-09-23: 작지의 혼용률을 품번과 함께 공유합니다. 비어 있으면 줄을 만들지 않습니다. */
    if(String(e.blend || "").trim()){
      var bl = document.createElement("div");
      bl.className = "blend";
      var blLabel = document.createElement("span");
      blLabel.className = "meta-label";
      blLabel.textContent = "혼용률";
      bl.appendChild(blLabel);
      bl.appendChild(document.createTextNode(String(e.blend).trim()));
      body.appendChild(bl);
    }

    if(Array.isArray(e.colors) && e.colors.length){
      var cw = document.createElement("div");
      cw.className = "colors";
      var colorLabel = document.createElement("span");
      colorLabel.className = "colors-label";
      colorLabel.textContent = "🎨 컬러";
      cw.appendChild(colorLabel);
      e.colors.forEach(function(c){
        // 예전 자료는 색 이름만 있고, 새 자료는 색값도 같이 옵니다. 둘 다 받습니다.
        var name = (c && typeof c === "object") ? c.n : c;
        var bg   = (c && typeof c === "object") ? c.h : null;
        var fg   = (c && typeof c === "object") ? c.t : null;
        var ch = document.createElement("span");
        ch.className = "chip";
        if(bg){
          ch.style.background = bg;
          if(fg) ch.style.color = fg;
          // 글자색이 어두우면 바탕이 밝은 색이라는 뜻이라 테두리를 줍니다
          if(fg && fg.toLowerCase() !== "#ffffff") ch.className += " light";
        }
        ch.textContent = name;
        cw.appendChild(ch);
      });
      body.appendChild(cw);
    }

    var cr = coordiRow(x.code);
    if(cr) body.appendChild(cr);

    /* 발주생산은 물류가 도착 확인. PDP는 MD가 상세페이지 등록 완료 처리하며,
       도착 취소는 오조작 복구용으로 아래에 유지합니다. */
    if(e.status === "order" || e.status === "pdp"){
      var arow = document.createElement("div");
      arow.className = "arrive-row";
      var abtn = document.createElement("button");
      abtn.type = "button";
      if(e.status === "order"){
        abtn.className = "arrive-btn go";
        abtn.textContent = "도착 확인";
        abtn.addEventListener("click", function(){ markArrived_(x.code, e.pumMyeong, abtn); });
      }else{
        var doneBtn = document.createElement("button");
        doneBtn.type = "button";
        doneBtn.className = "arrive-btn complete";
        doneBtn.textContent = "상세페이지 등록 완료";
        doneBtn.addEventListener("click", function(){ completePdp_(x.code, e.pumMyeong, doneBtn); });
        arow.appendChild(doneBtn);
        abtn.className = "arrive-btn undo";
        abtn.textContent = "↩ 도착 취소";
        abtn.addEventListener("click", function(){ undoArrived_(x.code, e.pumMyeong, abtn); });
      }
      arow.appendChild(abtn);
      body.appendChild(arow);
      if(e.status === "pdp" && e.arrivedAt){
        var at = document.createElement("div");
        at.className = "arrived-at";
        at.textContent = "도착일 " + e.arrivedAt;
        body.appendChild(at);
      }
    }

    card.appendChild(body);
    gridEl.appendChild(card);
  });
}

/* ---------- 사진 크게 보기 ---------- */
/* 이 화면이 하는 일은 이게 전부입니다. 고치거나 지우는 자리는 없습니다. */
var viewerEl    = document.getElementById("viewer");
var viewerImgEl = document.getElementById("viewerImg");
var viewerCloseEl = document.getElementById("viewerClose");
var viewerLastFocus = null;

function openViewer(src, alt){
  if(!src) return;
  viewerLastFocus = document.activeElement;
  viewerImgEl.src = src;
  viewerImgEl.alt = alt || "";
  viewerEl.classList.add("on");
  viewerEl.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";   // 뒤 목록이 같이 밀리지 않게
  viewerCloseEl.focus();
}
function closeViewer(){
  if(!viewerEl.classList.contains("on")) return;
  viewerEl.classList.remove("on");
  viewerEl.setAttribute("aria-hidden", "true");
  viewerImgEl.removeAttribute("src");
  document.body.style.overflow = "";
  if(viewerLastFocus && viewerLastFocus.focus) viewerLastFocus.focus();
  viewerLastFocus = null;
}
/* 사진 자체를 누른 것은 닫기가 아닙니다. 바깥이나 ✕ 를 눌러야 닫힙니다. */
viewerEl.addEventListener("click", function(ev){
  if(ev.target === viewerImgEl) return;
  closeViewer();
});
document.addEventListener("keydown", function(ev){
  if(ev.key === "Escape") closeViewer();
  if(ev.key === "Tab" && viewerEl.classList.contains("on")){
    ev.preventDefault();
    viewerCloseEl.focus();
  }
});

/* ---------- 검색 ---------- */
document.getElementById("search").addEventListener("input", function(ev){
  query = (ev.target.value || "").trim().toLowerCase();
  render();
});

/* ---------- 자료 받기 ---------- */
firebase.database().ref("workorderShare").on("value", function(snap){
  all = snap.val() || {};
  dataReady = true;
  loadFailed = false;
  gridEl.setAttribute("aria-busy", "false");
  emptyEl.setAttribute("role", "status");
  var connection = document.getElementById("connection");
  connection.className = "connection ready";
  connection.textContent = "불러오기 완료";
  renderTabs();
  render();
}, function(err){
  loadFailed = true;
  gridEl.setAttribute("aria-busy", "false");
  var connection = document.getElementById("connection");
  connection.className = "connection error";
  connection.textContent = "연결 확인";
  renderTabs();
  emptyEl.setAttribute("role", "alert");
  emptyEl.style.display = "block";
  emptyEl.textContent = "자료를 불러오지 못했습니다. 새로고침해보시고, 계속 안 되면 담당자에게 알려주세요.";
  console.error(err);
});

renderTabs();
</script>
