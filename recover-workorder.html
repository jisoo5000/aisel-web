<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AISEL 초안 백업</title>
<style>body{max-width:390px;margin:24px auto;padding:0 12px;box-sizing:border-box;font:14px/1.6 system-ui,sans-serif;color:#34383c;background:#fff}h1{font-size:18px}h2{font-size:14px}button{min-height:36px;padding:6px 12px;font:inherit;border:1px solid #e3e5e7;border-radius:3px;background:#fff;color:inherit;cursor:pointer}#backup{background:#34383c;color:#fff}button:disabled{opacity:.5}article{border-top:1px solid #e3e5e7;padding:12px 0}p{overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap}small{color:#6c727c}[hidden]{display:none!important}</style>
<h1>AISEL 초안 백업</h1>
<p><strong>작성 중인 원래 창은 닫거나 새로고침하지 마세요.</strong></p>
<p id="code"></p><p>이 브라우저에 보관된 초안을 파일로 내려받습니다. 작업지시서와 서버 내용은 변경하지 않습니다.</p>
<p id="status" role="status" aria-live="polite">초안을 확인하고 있습니다…</p>
<div class="actions"><button id="backup" disabled>초안 파일 내려받기</button><button id="refresh">다시 확인</button></div>
<section id="records"></section><p id="next" hidden>내려받은 JSON 파일을 보관하고 이 대화에 첨부해 주세요. 현재 창은 그대로 유지해 주세요.</p>
<script>
'use strict';
const code=new URL(location.href).searchParams.get('code')||'';
const status=document.getElementById('status'),list=document.getElementById('records'),backup=document.getElementById('backup');
document.getElementById('code').textContent='품번: '+code;
let records=[];
function database(){return new Promise((resolve,reject)=>{const req=indexedDB.open('aisel-workorder-drafts');let absent=false;const timer=setTimeout(()=>reject(Error('기기 초안 확인이 지연됩니다. 기존 창을 유지하고 다시 확인해주세요.')),5000);
req.onupgradeneeded=()=>{absent=true;req.transaction.abort();};
req.onerror=()=>{clearTimeout(timer);reject(Error(absent?'이 브라우저에서 보관된 초안을 찾지 못했습니다.':'기기 저장소를 읽지 못했습니다. 기존 창은 유지해주세요.'));};
req.onsuccess=()=>{clearTimeout(timer);resolve(req.result);};});}
async function read(){backup.disabled=true;records=[];list.replaceChildren();document.getElementById('next').hidden=true;
if(!/^[A-Za-z0-9_-]{4,80}$/.test(code)){status.textContent='품번을 확인해주세요. 기존 창은 유지해주세요.';return;}
let db;try{db=await database();const all=await new Promise((resolve,reject)=>{const tx=db.transaction('drafts','readonly'),r=tx.objectStore('drafts').getAll();let value;r.onsuccess=()=>value=r.result;tx.oncomplete=()=>resolve(value);tx.onerror=tx.onabort=()=>reject(tx.error||Error('초안을 읽지 못했습니다.'));});
records=all.filter(r=>r.schema===1&&r.code===code&&r.values).sort((a,b)=>b.savedAt-a.savedAt);
status.textContent=records.length?'보관된 초안 '+records.length+'개를 찾았습니다. 먼저 파일로 내려받아 주세요.':'이 품번의 초안을 찾지 못했습니다. 작성 중인 창은 유지하고 이 결과를 알려주세요.';
for(const r of records){const card=document.createElement('article'),title=document.createElement('h2'),info=document.createElement('p'),cost=document.createElement('small');title.textContent=r.values.pumMyeong||'이름 없는 작지';info.textContent=new Date(r.savedAt).toLocaleString('ko-KR')+' · 사진 '+(r.values.p1?'있음':'없음');cost.textContent='원가 항목 '+(Array.isArray(r.values.lines)?r.values.lines.length:0)+'개 · 공임 '+(r.values.gongim||'빈칸')+' · 시야게 '+(r.values.siyage||'빈칸');card.append(title,info,cost);list.append(card);}backup.disabled=!records.length;
}catch(e){status.textContent=e.message||'초안 확인 실패. 기존 창은 유지해주세요.';}finally{db?.close();}}
backup.onclick=()=>{if(!records.length)return;const blob=new Blob([JSON.stringify({format:'aisel-workorder-drafts',version:1,exportedAt:new Date().toISOString(),workorder:code,drafts:records},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=code+'-복구초안-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);document.getElementById('next').hidden=false;status.textContent='다운로드를 요청했습니다. 브라우저의 다운로드 목록에서 JSON 파일을 확인해주세요.';};
document.getElementById('refresh').onclick=read;read();
</script></html>
